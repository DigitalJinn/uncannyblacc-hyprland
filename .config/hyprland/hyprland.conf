# UncannyBlacc Hyprland config
# Lightweight config tuned for 13.5" 8GB laptop usage

$mod = SUPER

# Monitor setup
monitor = eDP-1, 1920x1200@60, 0x0, 1

# Workspace naming
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1

# General
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(B85C3Aff) rgba(C99A3Eff) 45deg
    col.inactive_border = rgba(171412ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    drop_shadow = true
    shadow_range = 18
    shadow_render_power = 2
    col.shadow = rgba(0, 0, 0, 0.5)
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    animation = windowsIn, 1, 4, default
    animation = windowsOut, 1, 4, default
    animation = border, 1, 8, default
    animation = fade, 1, 8, default
    animation = workspaces, 1, 5, default
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

misc {
    disable_hyprland_logo = true
    vfr = true
    vrr = 2
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# Variables
$term = alacritty
$browser = firefox
$fileman = nautilus
$menu = wofi --show drun --normal-window

# Startup
exec-once = ~/.local/bin/set-wallpaper.sh ~/.local/share/uncannyblacc/wallpapers/uncannyblacc-dark.svg
exec-once = waybar
exec-once = dunst
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Keybinds
bind = $mod, RETURN, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, F, exec, $fileman
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, swaylock
bind = $mod, S, exec, ~/.local/bin/set-wallpaper.sh ~/.local/share/uncannyblacc/wallpapers/uncannyblacc-accent.svg
bind = $mod SHIFT, S, exec, ~/.local/bin/set-wallpaper.sh ~/.local/share/uncannyblacc/wallpapers/uncannyblacc-light.svg
bind = $mod, W, exec, ~/.local/bin/set-wallpaper.sh ~/.local/share/uncannyblacc/wallpapers/uncannyblacc-dark.svg

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Switch workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

# Resize windows
bind = $mod, H, resizeactive, -20 0
bind = $mod, L, resizeactive, 20 0
bind = $mod, K, resizeactive, 0 -20
bind = $mod, J, resizeactive, 0 20

# Media controls
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Window rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Open Files)$
windowrulev2 = opacity 0.95 0.85, class:^(alacritty)$
windowrulev2 = opacity 0.9 0.8, class:^(firefox)$

# Workspace-specific rules
workspace = 1, border:true, rounding:true
workspace = 2, border:true, rounding:true
workspace = 3, border:true, rounding:true
workspace = 4, border:true, rounding:true
workspace = 5, border:true, rounding:true
workspace = 6, border:true, rounding:true
